<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Aura - Đo Lường Năng Lượng Cực Chuẩn</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #2b1055, #7597de);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        .container {
            width: 90%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        h1 {
            margin-top: 0;
            font-size: 26px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        p.desc {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-align: center;
            outline: none;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        input[type="text"]::placeholder {
            color: #ccc;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            transition: 0.2s;
        }
        button:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
        }
        #scanner-box {
            display: none;
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
            color: #00ffcc;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #00ffcc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #result-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .aura-title {
            font-size: 20px;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .aura-score {
            font-size: 28px;
            font-weight: bold;
            color: #ff4757;
            margin: 5px 0;
        }
        .aura-desc {
            font-size: 14px;
            color: #eee;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ CHECK AURA ✨</h1>
        <p class="desc">Nhập tên để hệ thống quét năng lượng & đo độ uy tín của bạn!</p>
        
        <div class="input-group">
            <input type="text" id="username" placeholder="Nhập tên của bạn...">
        </div>
        
        <button onclick="startCheck()">Bắt Đầu Check Aura</button>

        <div id="scanner-box">
            <div class="spinner" id="loading-spinner"></div>
            <span id="scan-text">Đang kết nối vũ trụ...</span>
        </div>

        <div id="result-box">
            <div id="res-name" style="font-size: 15px; color: #aaa; margin-bottom: 5px;"></div>
            <div class="aura-title" id="res-title"></div>
            <div class="aura-score" id="res-score"></div>
            <div class="aura-desc" id="res-desc"></div>
            <button onclick="resetGame()" style="margin-top: 15px; background: #2ed573; font-size: 15px; padding: 8px;">Check Lại</button>
        </div>
    </div>

<script>
    const dataAura = [
        { title: "🔥 Aura Hủy Diệt", min: 90, max: 100, desc: "Đi đến đâu, trầm trồ đến đó. Khí chất ngút trời, không ai dám hó hé!" },
        { title: "💎 Aura Tổng Tài", min: 75, max: 89, desc: "Sang trọng, quyền lực, hít thở thôi cũng thấy mùi tiền và sự uy tín." },
        { title: "😎 Aura Chill Phết", min: 50, max: 74, desc: "Sống hệ thản nhiên, nước đến chân mới nhảy nhưng lúc nào cũng may mắn." },
        { title: "🤡 Aura Hề Chúa", min: 25, max: 49, desc: "Năng lượng tích cực... nhưng theo hướng tấu hài. Chưa mở miệng người ta đã thấy buồn cười." },
        { title: "📉 Âm Aura", min: 0, max: 24, desc: "Hít thở thôi cũng sai phong thủy. Cẩn thận đi đường rớt ví!" }
    ];

    function startCheck() {
        const nameInput = document.getElementById('username').value.trim();
        if (!nameInput) {
            alert('Vui lòng nhập tên trước khi check aura nhé!');
            return;
        }

        // Ẩn kết quả cũ, hiện loading
        document.getElementById('result-box').style.display = 'none';
        const scannerBox = document.getElementById('scanner-box');
        const spinner = document.getElementById('loading-spinner');
        const scanText = document.getElementById('scan-text');
        
        scannerBox.style.display = 'flex';
        spinner.style.display = 'block';

        const steps = [
            "Đang quét vân tay tâm hồn...",
            "Đo tần số rung động vũ trụ...",
            "Đang đối chiếu bảng phong thủy...",
            "Hoàn tất! Chuẩn bị công bố kết quả..."
        ];

        let stepIndex = 0;
        scanText.textContent = steps[stepIndex];

        let interval = setInterval(() => {
            stepIndex++;
            if (stepIndex < steps.length) {
                scanText.textContent = steps[stepIndex];
            } else {
                clearInterval(interval);
                showResult(nameInput);
            }
        }, 700);
    }

    function showResult(name) {
        document.getElementById('scanner-box').style.display = 'none';
        document.getElementById('loading-spinner').style.display = 'none';

        // Random điểm số từ 0 đến 100
        const score = Math.floor(Math.random() * 101);
        
        // Tìm phân loại phù hợp
        let matched = dataAura.find(item => score >= item.min && score <= item.max);

        document.getElementById('res-name').textContent = `Kết quả của: ${name}`;
        document.getElementById('res-title').textContent = matched.title;
        document.getElementById('res-score').textContent = `${score} Điểm Aura`;
        document.getElementById('res-desc').textContent = matched.desc;

        document.getElementById('result-box').style.display = 'block';
    }

    function resetGame() {
        document.getElementById('username').value = '';
        document.getElementById('result-box').style.display = 'none';
        document.getElementById('username').focus();
    }
</script>

</body>
</html>
